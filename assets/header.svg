<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="Valeria Puzikova — CFD, immersed boundaries, HPC">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a123f"/>
      <stop offset="0.55" stop-color="#4b206f"/>
      <stop offset="1" stop-color="#7e3aa8"/>
    </linearGradient>
    <linearGradient id="flow1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff794c" stop-opacity="0.05"/>
      <stop offset="0.5" stop-color="#ff794c" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffb38f" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="flow2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8b4fe" stop-opacity="0.05"/>
      <stop offset="0.5" stop-color="#d8b4fe" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#d8b4fe" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="bodyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff794c" stop-opacity="0.9"/>
      <stop offset="0.38" stop-color="#ff794c" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff794c" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>

  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 80H1200M0 160H1200M0 240H1200"/>
    <path d="M200 0V320M400 0V320M600 0V320M800 0V320M1000 0V320"/>
  </g>

  <g fill="none" stroke-linecap="round" filter="url(#glow)">
    <path d="M-60 250C150 180 280 280 470 210S800 120 1010 180s220 20 250-10" stroke="url(#flow1)" stroke-width="3"/>
    <path d="M-60 210C160 150 300 245 500 175S830 85 1040 145s200 15 220-5" stroke="url(#flow2)" stroke-width="1.8"/>
    <path d="M-60 285C150 215 290 315 480 245S810 155 1020 215s210 10 240-15" stroke="url(#flow2)" stroke-width="1.3" opacity="0.7"/>
  </g>

  <ellipse cx="1015" cy="160" rx="185" ry="140" fill="url(#bodyGlow)"/>

  <g transform="translate(1015 160) scale(0.8)">
    <g fill="none" stroke="#ffb38f" stroke-width="1.2" stroke-dasharray="4 7" opacity="0.55" transform="scale(1.1)">
      <path d="M0 -22C26 -52 48 -96 30 -136C12 -164 -26 -154 -34 -116C-42 -78 -22 -36 0 -22Z"/>
      <path d="M0 -22C26 -52 48 -96 30 -136C12 -164 -26 -154 -34 -116C-42 -78 -22 -36 0 -22Z" transform="rotate(120)"/>
      <path d="M0 -22C26 -52 48 -96 30 -136C12 -164 -26 -154 -34 -116C-42 -78 -22 -36 0 -22Z" transform="rotate(240)"/>
    </g>

    <g fill="#21122f" stroke="#ff794c" stroke-width="3.4" stroke-linejoin="round">
      <path d="M0 -22C26 -52 48 -96 30 -136C12 -164 -26 -154 -34 -116C-42 -78 -22 -36 0 -22Z"/>
      <path d="M0 -22C26 -52 48 -96 30 -136C12 -164 -26 -154 -34 -116C-42 -78 -22 -36 0 -22Z" transform="rotate(120)"/>
      <path d="M0 -22C26 -52 48 -96 30 -136C12 -164 -26 -154 -34 -116C-42 -78 -22 -36 0 -22Z" transform="rotate(240)"/>
    </g>

    <g fill="none" stroke="#ffb38f" stroke-width="1.6" opacity="0.75">
      <path d="M0 -40C18 -66 31 -100 21 -124"/>
      <path d="M0 -40C18 -66 31 -100 21 -124" transform="rotate(120)"/>
      <path d="M0 -40C18 -66 31 -100 21 -124" transform="rotate(240)"/>
    </g>

    <circle r="15" fill="#ff794c"/>
    <circle r="25" fill="none" stroke="#ff794c" stroke-opacity="0.55" stroke-width="1.7"/>
  </g>

  <g fill="#ff794c">
    <circle cx="470" cy="210" r="5"/>
    <circle cx="930" cy="300" r="4" opacity="0.8"/>
  </g>

  <text x="64" y="142" fill="#f7f1fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="-1">Valeria Puzikova</text>
